<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPulse AI — Le Journal Tech</title>
  <meta name="description" content="Toute l'actualité tech dans votre boîte mail. Entrez votre email et recevez le journal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex flex-col justify-between font-sans selection:bg-blue-600 selection:text-white px-6">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-blue-600/15 blur-[120px] rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="w-full max-w-xl mx-auto py-8 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-md shadow-blue-500/20">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span class="text-lg font-black tracking-tight text-white">TechPulse <span class="text-blue-500">AI</span></span>
    </div>
    <a href="/editions.html" class="text-xs text-slate-400 hover:text-white transition">Archives</a>
  </header>

  <!-- Main Box : 1 champ email + 1 bouton Envoyer -->
  <main class="w-full max-w-xl mx-auto flex-1 flex flex-col justify-center text-center py-12">
    
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-white mb-4">
      L'actualité tech, <span class="text-blue-500">directement par email.</span>
    </h1>

    <p class="text-base text-slate-400 mb-8 max-w-md mx-auto">
      Deux éditions quotidiennes automatisées : le matin à 6h15 et l'après-midi à 16h30.
    </p>

    <!-- Ultra-Simple Form -->
    <div class="max-w-md w-full mx-auto">
      <form id="direct-form" class="flex flex-col sm:flex-row gap-2.5">
        <input 
          type="email" 
          id="email-input" 
          required 
          placeholder="votre.email@exemple.com"
          class="flex-1 px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base shadow-inner"
        >
        <button 
          type="submit" 
          id="submit-btn"
          class="px-8 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-base shadow-lg shadow-blue-600/30 transition active:scale-[0.98] flex items-center justify-center cursor-pointer"
        >
          <span id="btn-text">Envoyer</span>
          <svg id="btn-spinner" class="hidden w-5 h-5 ml-2 animate-spin text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <!-- Feedback Alert -->
      <div id="form-alert" class="hidden mt-4 text-sm px-4 py-3 rounded-xl text-center leading-relaxed font-medium"></div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-xl mx-auto py-6 border-t border-slate-900/80 text-xs text-slate-500 flex items-center justify-between">
    <span>© TechPulse AI</span>
    <div class="space-x-4">
      <a href="/privacy.html" class="hover:text-slate-400 transition">Confidentialité</a>
      <a href="/unsubscribe.html" class="hover:text-rose-400 transition">Se désinscrire</a>
    </div>
  </footer>

  <script>
    const form = document.getElementById('direct-form');
    const emailInput = document.getElementById('email-input');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('form-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      btnText.innerText = 'Envoi...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;
      alertBox.classList.add('hidden');

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (data.success) {
          alertBox.className = 'mt-4 text-sm px-4 py-3 rounded-xl text-center leading-relaxed font-medium bg-emerald-950/80 text-emerald-300 border border-emerald-800/80';
          alertBox.innerText = data.message;
          alertBox.classList.remove('hidden');
          emailInput.value = '';
        } else {
          alertBox.className = 'mt-4 text-sm px-4 py-3 rounded-xl text-center leading-relaxed font-medium bg-rose-950/80 text-rose-300 border border-rose-800/80';
          alertBox.innerText = data.error || 'Erreur lors de l\'envoi.';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.className = 'mt-4 text-sm px-4 py-3 rounded-xl text-center leading-relaxed font-medium bg-rose-950/80 text-rose-300 border border-rose-800/80';
        alertBox.innerText = 'Impossible de joindre le serveur. Réessayez dans un instant.';
        alertBox.classList.remove('hidden');
      } finally {
        btnText.innerText = 'Envoyer';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
